# Dependabot : une seule proposition groupée par mois pour les petites mises à jour
# (mineures et correctifs). Les versions majeures, qui peuvent casser l'appli,
# ne sont jamais proposées d'office : on les fait à la main, en testant toute l'appli.
# Les alertes de sécurité restent visibles dans l'onglet « Security » du dépôt.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      petites-mises-a-jour:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']
